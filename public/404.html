<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Spider-Man × Venom</title>
  <script type="text/javascript">
    // GitHub Pages client-side routing fallback redirect
    var path = window.location.pathname;
    var repoName = "/Spidy_web";
    var cleanPath = path.replace(repoName, "");
    
    // Redirect the browser to our HashRouter format equivalent
    window.location.replace(window.location.origin + repoName + "/#" + cleanPath + window.location.search + window.location.hash);
  </script>
</head>

  Initialising Secure Link...
</body>
</html>
